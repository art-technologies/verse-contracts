[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Keep these settings and the src/ paths unchanged: they are part of the deployed contracts'
# metadata hash, which the Etherscan and Sourcify verifications match exactly.
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
ffi = false
# The Ethereum fork test deploys the real CustodialNFTVault from the sibling project.
allow_paths = ["../custodial-vault"]
include_paths = [".."]
fs_permissions = [
    { access = "read", path = "./deployments" },
    { access = "write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 131072

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 2048

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
# Preserve the upstream Limit Break source used by the deployed contracts.
ignore = ["src/erc721c/vendor/**"]

[rpc_endpoints]
ethereum = "${ETHEREUM_RPC_URL}"
base = "${BASE_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[lint]
# forge lint does not resolve include_paths; the vault import compiles normally.
ignore = ["test/fork/EthereumERC721CFork.t.sol"]
