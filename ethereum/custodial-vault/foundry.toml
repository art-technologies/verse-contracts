[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
ffi = false
# Test-only mock: SELFDESTRUCT deprecation (5159) is intentional there — it
# models forced native-currency transfer into the vault.
ignored_warnings_from = ["test/mocks/ForceSend.sol"]
fs_permissions = [
    { access = "read", path = "./deployments" },
    { access = "write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 131072

[profile.default.invariant]
runs = 64
depth = 128
fail_on_revert = false
call_override = false

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
ethereum = "${ETHEREUM_RPC_URL}"
base = "${BASE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
shape = "${SHAPE_RPC_URL}"

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
polygon = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
