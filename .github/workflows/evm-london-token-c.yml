name: EVM LondonTokenC CI

on:
  push:
    branches: [main]
    paths:
      - "ethereum/london-token-c/**"
      # The Ethereum fork test deploys the vault from this project.
      - "ethereum/custodial-vault/src/**"
      - ".gitmodules"
      - ".github/workflows/evm-london-token-c.yml"
  pull_request:
    paths:
      - "ethereum/london-token-c/**"
      - "ethereum/custodial-vault/src/**"
      - ".gitmodules"
      - ".github/workflows/evm-london-token-c.yml"

env:
  FOUNDRY_PROFILE: ci

defaults:
  run:
    working-directory: ethereum/london-token-c

jobs:
  quality-gates:
    name: fmt / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Formatting gate
        run: forge fmt --check

      - name: Build with size report
        run: forge build --sizes

      - name: Tests (unit; fork tests skip without RPC)
        run: forge test -vvv

  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither (pinned)
        run: pip install slither-analyzer==0.11.3

      - name: Static analysis gate
        run: slither .
